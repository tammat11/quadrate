<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BI Dashboard | Квадрат мечты</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <div id="loaderProgressBar">
            <div id="loaderProgressFill"></div>
        </div>
        <div id="loaderStatus" class="loader-status-text">Подготовка...</div>
    </div>

    <div class="dashboard-container">
        <header>
            <div class="logo-section">
                <h1>Квадрат мечты</h1>
            </div>
            <div class="controls">
                <a class="cabinet-entry-link" href="/cabinet.html">Войти в кабинет</a>
                <select id="monthSelect"></select>
                <button id="refreshBtn">Обновить данные</button>
                <span id="lastUpdated" class="dashboard-last-updated"></span>
            </div>
        </header>

        <section class="analytics-hero">
            <article class="analytics-hero-card analytics-hero-primary">
                <div class="analytics-card-label">Средний балл сети</div>
                <div id="avgScoreTotal" class="analytics-hero-value">0.0</div>
                <div class="analytics-inline-metrics">
                    <div class="analytics-inline-metric">
                        <span>Партнёров</span>
                        <strong id="activeDealsCount">0</strong>
                    </div>
                    <div class="analytics-inline-metric">
                        <span>Объектов</span>
                        <strong id="heroObjectsCount">0</strong>
                    </div>
                    <div class="analytics-inline-metric">
                        <span>Площадь</span>
                        <strong id="heroAreaTotal">0 м²</strong>
                    </div>
                    <div class="analytics-inline-metric">
                        <span>Управленка</span>
                        <strong id="heroManagementAvg">0%</strong>
                    </div>
                </div>
            </article>
        </section>

        <div class="main-content">
            <div class="content-block content-block-wide">
                <div class="content-block-header">
                    <div class="content-block-title-wrap">
                        <h2>Матрица партнёров</h2>
                    </div>
                    <div class="content-block-actions">
                        <div id="matrixGroupControls" class="matrix-group-controls"></div>
                    </div>
                </div>
                <div class="matrix-table-shell">
                    <table id="matrixTable">
                        <thead id="matrixHead"></thead>
                        <tbody id="matrixBody"></tbody>
                    </table>
                </div>
                <details id="exampleCalcPanel" class="example-calc-panel" style="margin-top: 1rem; display: none;">
                    <summary>Пример расчёта</summary>
                    <div id="exampleCalcBlock" class="example-calc">
                        <div class="example-calc-toolbar">
                            <div>
                                <h3>Разбор расчёта по партнёру</h3>
                            </div>
                            <label class="example-calc-select-wrap" for="exampleCalcSelect">
                                <span>Партнёр</span>
                                <select id="exampleCalcSelect"></select>
                            </label>
                        </div>
                        <p id="exampleCalcPartner" class="example-calc-partner"></p>
                        <div id="exampleCalcFormula" class="example-calc-columns"></div>
                        <div id="exampleCalcTotal" class="example-calc-total"></div>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
